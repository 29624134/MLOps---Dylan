workflows:
  predictive_maintenance:
    description: "Predictive Maintenance Pipeline for Pump Monitoring"
    version: "1.0"
    steps:
      - id: data_ingestion
        type: ingestion
        config:
          schema_path: "config/data_schema.json"
          input_location: "D:/Data + Models/Data/CWRU/12k Drive End - Original/1 HP"
          output_location: "workflow_data/{run_id}/data/1 HP (12k).npz"
          state_location: "workflow_data/{run_id}/state/data_ingestion_complete.flag" #what has already been processed
          segment_length: 1024
          segments_per_file: 115
          sample_rate: 12000
          log_path: "workflow_data/{run_id}/logs/data_ingestion.log" #human-readable record of what happened during the pipeline
        output:
          - segmented_data
        required: true

      - id: feature_extraction
        type: feature_engineering
        depends_on: [ "data_ingestion" ]
        config:
          input_location: "workflow_data/{run_id}/data/1 HP (12k).npz"
          output_location: "workflow_data/{run_id}/data/features"
          state_location: "workflow_data/{run_id}/state/feature_extraction_complete.flag" #what has already been processed
          feature_types:
            - time_domain
            - wavelet_energy
            - wavelet_entropy
          sample_rate: 12000
          extractor_version: "1.0"
          log_path: "workflow_data/{run_id}/logs/feature_extraction.log"
        outputs:
          - extracted_features
        required: true

      - id: data_validation
        type: validation
        depends_on: ["feature_extraction"]
        config:
          schema_path: "config/data_schema.json"
          input_location: "workflow_data/{run_id}/data/features"
          output_location: "workflow_data/{run_id}/validation/validation.json"
          log_path: "workflow_data/{run_id}/logs/data_validation.log"
          state_location: "workflow_data/{run_id}/state/data_validation_complete.flag"
        output:
          - validation_results
        required: true

      - id: feature_storage
        type: storage
        depends_on: [ "data_validation" ]
        config:
          storage_type: "mongodb"
          mongo_uri: "mongodb://localhost:27017"
          db_name: "feature_store_{run_id}"
          collection_name: ""
          dataset_id: "pump_vibration_features"
          version: "v1.0"
          df_path: "workflow_data/{run_id}/data/features"
          metadata:
            source: "CWRU Dataset"
            description: "Extracted vibration features for fault classification"
          log_path: "workflow_data/{run_id}/logs/feature_storage.log"
        outputs:
          - stored_features
        required: true

      - id: model_training
        type: training
        depends_on: ["feature_storage"]
        config:
          input_location: "workflow_data/{run_id}/data/features/wavelet_energy.csv"
          output_location: "workflow_data/{run_id}/trained_models/bagging.pkl"
          state_location: "workflow_data/{run_id}/state/model_training_complete.flag"
          test_size: 420
          random state: 325
          log_path: "workflow_data/{run_id}/logs/model_training.log"
        outputs:
          - trained_model



Databuilder:
  #is the following neccasary?
  - id: dataset_builder
    type: preprocessing
    depends_on: [ "feature_extraction" ]
    config:
      input_location: "data/{run_id}/CWRU_12k_features.csv"
      output_location: "data/{run_id}/CWRU_12k_processed.parquet"
      state_location: "state/{run_id}/dataset_builder_complete.flag"
      feature_metadata_path: "metadata/{run_id}/feature_metadata.json"
      one_hot_encoding: true          # or false if you prefer label encoding
      drop_na: false                  # drop missing rows or not
      scaling_method: "minmax"        # MinMaxScaler (default)
      save_encoders: true
      save_scalers: true
      log_path: "logs/{run_id}/dataset_builder.log"
    outputs:
      - processed_features
    required: true