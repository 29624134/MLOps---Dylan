workflows:
  rul_prediction:
    description: "PHM 2012 Bearing RUL Prediction Pipeline"
    version: "1.0"

    # Bearing registry — defines which bearings exist, their roles, and
    # source data paths. Add new bearings here only.
    bearing_config: "config/bearings.json"

    steps:

      # ---------------------------------------------------------------
      # INGESTION template
      # Consolidated parquet is written next to the source CSVs so it
      # persists across runs (no re-ingestion if already done).
      # ---------------------------------------------------------------
      - id: ingestion
        type: ingestion
        config:
          save_format: "parquet"
          state_base: "workflow_data/{run_id}/state"
          log_base: "workflow_data/{run_id}/logs"

      # ---------------------------------------------------------------
      # FEATURE EXTRACTION template
      # features.csv is written next to the source data so it persists
      # across runs. Extraction is skipped if features.csv already exists.
      #
      # PRE-PROCESSING (signal_preprocessor.py)
      # To disable all pre-processing:  set preprocessor.enabled: false
      # To disable individual steps:    set the relevant flag to false
      # Changes here take effect on the NEXT run — delete features.csv
      # first if you want to re-extract with a different config.
      # ---------------------------------------------------------------
      - id: feature_engineering
        type: feature_engineering
        depends_on: ["ingestion"]
        config:
          state_base: "workflow_data/{run_id}/state"
          log_base: "workflow_data/{run_id}/logs"
          burst_period: 10.0
          failure_threshold: 20.0
          n_consecutive: 1

      # ---------------------------------------------------------------
      # VALIDATION
      # Reads features.csv from each bearing's source folder.
      # ---------------------------------------------------------------
      - id: validation
        type: validation
        depends_on: ["feature_engineering"]
        config:
          schema_path: "config/data_schema.json"
          output_location: "workflow_data/{run_id}/validation/validation.json"
          state_location: "workflow_data/{run_id}/state/validation.flag"
          log_path: "workflow_data/{run_id}/logs/validation.log"

      # ---------------------------------------------------------------
      # TRAINING
      # File lists are built dynamically from bearing registry roles.
      # ---------------------------------------------------------------
      - id: training
        type: training
        depends_on: ["validation"]
        config:
          output_location: "workflow_data/{run_id}/models"
          state_location: "workflow_data/{run_id}/state/training.flag"
          log_path: "workflow_data/{run_id}/logs/training.log"
          window_size: 40
          rul_scale: 30000.0
          model_params:
            horizon: 10
            hidden_units: [128, 64]
            dropout: 0.25
            epochs: 600
            lr: 0.0001
            batch_size: 32
            patience: 30
            seed: 42

      # ---------------------------------------------------------------
      # MODEL SELECTION
      # ---------------------------------------------------------------
      - id: model_selection
        type: model_selection
        depends_on: ["training"]
        config:
          metric: "mae_s"
          state_location: "workflow_data/{run_id}/state/model_selection.flag"
          log_path: "workflow_data/{run_id}/logs/model_selection.log"

      # ---------------------------------------------------------------
      # LIVE SERVING
      # Streams acc_*.csv from each bearing with role='live' in
      # bearings.json through the deployed model, one burst at a time.
      # Predictions are saved to workflow_data/{run_id}/live/
      #
      # realtime: false  = fast replay (for testing, no sleep between bursts)
      # realtime: true   = sleep burst_period seconds between bursts
      #                    (matches real sensor rate)
      # ---------------------------------------------------------------
      - id: live_serving
        type: live_serving
        depends_on: ["model_selection"]
        config:
          window_size: 40
          burst_period: 10.0
          realtime: false
          output_base: "workflow_data/{run_id}/live"
          state_location: "workflow_data/{run_id}/state/live_serving.flag"
          log_path: "workflow_data/{run_id}/logs/live_serving.log"