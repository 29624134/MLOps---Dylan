workflows:
  rul_prediction:
    description: "PHM 2012 Bearing RUL Prediction Pipeline"
    version: "1.0"

    # Bearing registry — defines which bearings exist, their roles, and
    # source data paths. Add new bearings here only.
    bearing_config: "config/bearings.json"

    # ---------------------------------------------------------------
    # MONGODB
    # Feature Store connection settings.
    # Set enabled: false to skip all MongoDB writes.
    # ---------------------------------------------------------------
    mongodb:
      enabled: true
      uri: "mongodb://localhost:27017"
      db_name: "phm_mlops"

    # ---------------------------------------------------------------
    # GROUP MODEL OVERRIDES
    # Controls which model architecture each bearing group trains.
    #
    # Supported model_type values:
    #   "MLP"      — Multi-Layer Perceptron (default)
    #   "CNN_LSTM" — 1D CNN → LSTM → Attention with condition embedding
    #
    # The model_type here overrides the model_type in the training step
    # config for that specific group. Groups not listed here fall back
    # to the model_type defined in the training step config below.
    #
    # To change a group's model: edit model_type here only.
    # No Python code changes are needed.
    # ---------------------------------------------------------------
    group_model_overrides:
      "1":
        model_type: "CNN_LSTM"
      "2":
        model_type: "CNN_LSTM"
      "3":
        model_type: "MLP"

    steps:

      # ---------------------------------------------------------------
      # INGESTION template
      # Consolidated parquet is written next to the source CSVs so it
      # persists across runs (no re-ingestion if already done).
      # ---------------------------------------------------------------
      - id: ingestion
        type: ingestion
        config:
          save_format: "parquet"
          state_base: "workflow_data/{run_id}/state"
          log_base: "workflow_data/{run_id}/logs"

      # ---------------------------------------------------------------
      # FEATURE EXTRACTION template
      # features.csv is written next to the source data so it persists
      # across runs. Extraction is skipped if features.csv already exists.
      #
      # PRE-PROCESSING (signal_preprocessor.py)
      # To disable all pre-processing:  set preprocessor.enabled: false
      # To disable individual steps:    set the relevant flag to false
      # Changes here take effect on the NEXT run — delete features.csv
      # first if you want to re-extract with a different config.
      # ---------------------------------------------------------------
      - id: feature_engineering
        type: feature_engineering
        depends_on: ["ingestion"]
        config:
          state_base: "workflow_data/{run_id}/state"
          log_base: "workflow_data/{run_id}/logs"
          burst_period: 10.0
          failure_threshold: 20.0
          n_consecutive: 1

      # ---------------------------------------------------------------
      # VALIDATION
      # Reads features.csv from each bearing's source folder.
      # ---------------------------------------------------------------
      - id: validation
        type: validation
        depends_on: ["feature_engineering"]
        config:
          schema_path: "config/data_schema.json"
          output_location: "workflow_data/{run_id}/validation/validation.json"
          state_location: "workflow_data/{run_id}/state/validation.flag"
          log_path: "workflow_data/{run_id}/logs/validation.log"

      # ---------------------------------------------------------------
      # TRAINING
      # File lists are built dynamically from bearing registry roles.
      #
      # model_type sets the DEFAULT model for any group not listed in
      # group_model_overrides above. In the current setup this acts as
      # the fallback only — all three groups are explicitly configured.
      #
      # MLP model_params (used by Group 1 and Group 3):
      #   hidden_units, dropout, epochs, lr, batch_size, patience, seed
      #
      # CNN-LSTM model_params (used by Group 2):
      #   cnn_channels, cnn_kernel, cnn_pool, lstm_hidden, lstm_layers,
      #   fc_hidden, condition_emb_dim, dropout, epochs, lr, batch_size,
      #   patience, seed
      #   seq_len is auto-set from window_size if not specified here.
      #
      # Both model types share: horizon, rul_scale (injected automatically).
      # ---------------------------------------------------------------
      - id: training
        type: training
        depends_on: ["validation"]
        config:
          output_location: "workflow_data/{run_id}/models"
          state_location: "workflow_data/{run_id}/state/training.flag"
          log_path: "workflow_data/{run_id}/logs/training.log"
          window_size: 40
          rul_scale: 30000.0
          # Default model type — overridden per group by group_model_overrides
          model_type: "MLP"
          # MLP params (Groups 1 and 3)
          model_params:
            horizon: 10
            hidden_units: [128, 64]
            dropout: 0.25
            epochs: 600
            lr: 0.0001
            batch_size: 32
            patience: 30
            seed: 42
          # CNN-LSTM params (Group 2)
          # These are merged in by the orchestrator when model_type = "CNN_LSTM"
          cnn_lstm_params:
            horizon: 10
            cnn_channels: [64, 128]
            cnn_kernel: 3
            cnn_pool: 2
            lstm_hidden: 128
            lstm_layers: 2
            fc_hidden: 64
            condition_emb_dim: 8
            dropout: 0.2
            epochs: 300
            lr: 0.001
            batch_size: 32
            patience: 60
            seed: 42

      # ---------------------------------------------------------------
      # MODEL SELECTION
      # ---------------------------------------------------------------
      - id: model_selection
        type: model_selection
        depends_on: ["training"]
        config:
          metric: "mae_s"
          state_location: "workflow_data/{run_id}/state/model_selection.flag"
          log_path: "workflow_data/{run_id}/logs/model_selection.log"

      # ---------------------------------------------------------------
      # LIVE SERVING
      # Streams acc_*.csv from each bearing with role='live' in
      # bearings.json through the deployed model, one burst at a time.
      # Predictions are saved to workflow_data/{run_id}/live/
      #
      # realtime: false  = fast replay (for testing, no sleep between bursts)
      # realtime: true   = sleep burst_period seconds between bursts
      #                    (matches real sensor rate)
      # ---------------------------------------------------------------
      - id: live_serving
        type: live_serving
        depends_on: ["model_selection"]
        config:
          window_size: 40
          burst_period: 10.0
          realtime: false
          output_base: "workflow_data/{run_id}/live"
          state_location: "workflow_data/{run_id}/state/live_serving.flag"
          log_path: "workflow_data/{run_id}/logs/live_serving.log"

      # ---------------------------------------------------------------
      # SERVING PIPELINE
      # Runs the full 4-stage pipeline (Feature Engineering → Inference →
      # Predictive Maintenance → MLOps Monitoring) for all live bearings.
      #
      # Outputs:
      #   step 7  → Feature Store (versioned features, MongoDB)
      #   step 9  → Serving History (MongoDB serving_history collection)
      #   step 10 → Audit Service (via Serving History metadata)
      #             Dashboard (RUL metrics via monitoring output)
      #             Export Service (stubbed)
      #
      # critical_threshold_s: RUL ≤ this → status = "critical"  (default 1 hr)
      # warning_threshold_s:  RUL ≤ this → status = "warning"   (default 4 hr)
      # baseline_path: where the monitoring baseline JSON is persisted.
      #   Delete this file to force a new baseline on the next run.
      # ---------------------------------------------------------------
      - id: serving_pipeline
        type: serving_pipeline
        depends_on: ["live_serving"]
        config:
          window_size: 40
          critical_threshold_s: 3600
          warning_threshold_s: 14400
          baseline_path: "workflow_data/monitoring_baseline.json"
          state_location: "workflow_data/{run_id}/state/serving_pipeline.flag"
          log_path: "workflow_data/{run_id}/logs/serving_pipeline.log"
          enable_serving_history: true
          enable_json_export: false